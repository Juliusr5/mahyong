<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Mahjong Zamrud</title>
  <meta name="description" content="Mahjong 13 kartu gaya Hong Kong — 1 pemain melawan 3 bot.">
  <meta name="theme-color" content="#0b2a20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mahjong">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="sprite"></div>

  <section id="screen-menu" class="screen active" aria-label="Menu utama">
    <div class="menu-card glass">
      <div class="menu-tiles" aria-hidden="true"></div>
      <h1 class="title">Mahjong <em>Zamrud</em></h1>
      <p class="subtitle">13 kartu · gaya Hong Kong</p>
      <div class="purse lg menu-purse"><span class="coin chip-icon"></span><b id="menu-chip-count">1.000</b><span class="unit">Kecik</span></div>
      <nav class="menu-buttons">
        <button class="btn gold" data-act="play">Main</button>
        <button class="btn" data-act="continue" id="btn-continue" hidden>Lanjutkan permainan</button>
        <button class="btn" data-act="refill" id="btn-refill" hidden>Isi ulang Kecik</button>
        <div class="menu-row">
          <button class="btn small" data-act="settings">Pengaturan</button>
          <button class="btn small" data-act="stats">Statistik</button>
          <button class="btn small" data-act="help">Bantuan</button>
        </div>
      </nav>
      <p class="menu-foot">Kecik hanya mainan — tanpa uang sungguhan.</p>
    </div>
  </section>

  <section id="screen-game" class="screen" aria-label="Meja permainan">
    <header class="topbar">
      <button class="icon-btn" data-act="menu" aria-label="Menu">☰</button>
      <div class="round-info" id="round-info"></div>
      <button class="icon-btn" data-act="log" aria-label="Riwayat ronde">≡</button>
      <button class="icon-btn" data-act="mute" id="btn-mute" aria-label="Suara">♪</button>
    </header>
    <div class="table">
      <div class="opp opp-top" id="opp-2"></div>
      <div class="opp opp-left" id="opp-3"></div>
      <div class="mid"><div class="board">
        <div class="river river-top" id="river-2"></div>
        <div class="river river-right" id="river-1"></div>
        <div class="center" id="center"></div>
        <div class="river river-left" id="river-3"></div>
        <div class="river river-bottom" id="river-0"></div>
      </div></div>
      <div class="opp opp-right" id="opp-1"></div>
    </div>
    <div class="me">
      <div class="me-info" id="me-info"></div>
      <div class="me-melds" id="me-melds"></div>
      <div class="hint-bar" id="hint-bar" hidden></div>
      <div class="tile-cap" id="tile-cap" aria-live="polite"></div>
      <div class="hand" id="hand" role="group" aria-label="Kartu di tangan"></div>
      <div class="actions" id="actions"></div>
    </div>
  </section>

  <div id="modal" class="modal" hidden>
    <div class="modal-card glass" role="dialog" aria-modal="true">
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="rotate" class="rotate" aria-live="polite">
    <div class="rotate-card glass">
      <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><rect x="20" y="6" width="24" height="44" rx="5" fill="none" stroke="#dcc08a" stroke-width="3"/><circle cx="32" cy="43" r="2" fill="#dcc08a"/><path d="M50 30a20 20 0 0 1-14 22" fill="none" stroke="#dcc08a" stroke-width="2.5"/><path d="M35 48l1 5 5-2" fill="none" stroke="#dcc08a" stroke-width="2.5"/></svg>
      <p class="rotate-title">Putar HP ke posisi tegak</p>
      <p class="rotate-sub">Permainan dijeda sampai HP tegak kembali.</p>
    </div>
  </div>
  <div id="fx" aria-hidden="true"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
